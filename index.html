<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranked Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101216;
    --bg-grid: #17191F;
    --surface: #1A1D24;
    --surface-2: #21252D;
    --border: #2A2E38;
    --text: #F2F1EC;
    --text-dim: #8C8F99;
    --accent: #E85D3D;
    --accent-glow: rgba(232, 93, 61, 0.25);

    --ht1: #F0654A; --ht1-bg: #3D241C; --ht1-border: #5C3629;
    --lt1: #ECA23D; --lt1-bg: #3D2F1C; --lt1-border: #5C4829;
    --ht2: #E8D23D; --ht2-bg: #3A351C; --ht2-border: #575029;
    --lt2: #9BD84A; --lt2-bg: #26361A; --lt2-border: #3A5227;
    --ht3: #4AD8A0; --ht3-bg: #1A3630; --ht3-border: #275249;
    --lt3: #4AC1D8; --lt3-bg: #1A3236; --lt3-border: #274C52;
    --ht4: #4A8FD8; --ht4-bg: #1A2836; --ht4-border: #273C52;
    --lt4: #7A6AE0; --lt4-bg: #251F3D; --lt4-border: #382E5C;
    --ht5: #B06AE0; --ht5-bg: #2E1F3D; --ht5-border: #45305C;
    --lt5: #6E7180; --lt5-bg: #23262E; --lt5-border: #383C47;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 42px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 42px 100%,
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  .display {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  header {
    padding: 3.5rem 1.5rem 2.5rem;
    text-align: center;
  }

  header .eyebrow {
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
  }

  header h1 {
    font-size: clamp(2.4rem, 7vw, 3.8rem);
    margin: 0.3rem 0 0.3rem;
    text-shadow: 0 0 40px var(--accent-glow);
  }

  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 0.9rem;
  }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  /* ---- Podium ---- */
  .podium {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.9rem;
    align-items: end;
    margin-bottom: 2.5rem;
  }

  .podium-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 0.9rem 1.3rem;
    text-align: center;
    position: relative;
    transition: transform 0.15s ease;
  }
  .podium-card:hover { transform: translateY(-3px); }

  .podium-card.rank-1 {
    order: 2;
    padding-top: 1.6rem;
    border-color: var(--ht1-border);
    box-shadow: 0 0 30px -8px var(--accent-glow);
  }
  .podium-card.rank-2 { order: 1; }
  .podium-card.rank-3 { order: 3; }

  .podium-rank {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 0.6rem;
  }
  .rank-1 .podium-rank { color: var(--ht1); }

  .podium-avatar {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    image-rendering: pixelated;
    background: var(--surface-2);
    border: 2px solid var(--border);
    margin-bottom: 0.6rem;
  }
  .rank-1 .podium-avatar { width: 68px; height: 68px; border-color: var(--ht1-border); }

  .podium-name {
    font-weight: 600;
    font-size: 0.92rem;
    margin-bottom: 0.4rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .podium-rating {
    font-size: 1.6rem;
    line-height: 1;
  }
  .rank-1 .podium-rating { font-size: 2.1rem; color: var(--ht1); }

  /* ---- Controls ---- */
  .controls {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .controls input, .controls select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.9rem;
    border-radius: 9px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .controls input:focus, .controls select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .controls input { flex: 1; min-width: 160px; }

  /* ---- Table ---- */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    padding: 0.8rem 1.1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s ease;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }

  td { padding: 0.65rem 1.1rem; font-size: 0.92rem; }
  td.rank { color: var(--text-dim); width: 40px; font-variant-numeric: tabular-nums; }
  td.player { display: flex; align-items: center; gap: 0.6rem; }
  td.rating {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--surface-2);
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: 7px;
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    border: 1px solid transparent;
  }
  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .empty, .error {
    text-align: center;
    color: var(--text-dim);
    padding: 3.5rem 1rem;
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    padding: 2.5rem 1rem 3rem;
  }

  @media (max-width: 520px) {
    .podium-name { font-size: 0.8rem; }
    .rank-1 .podium-rating { font-size: 1.7rem; }
    .podium-rating { font-size: 1.3rem; }
    thead th:nth-child(1), td.rank { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Ranked Duels</div>
  <h1 class="display">Leaderboard</h1>
  <p id="updated-at">Loading...</p>
</header>

<main>
  <div id="podium-slot"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search a player...">
    <select id="tier-filter">
      <option value="">All tiers</option>
      <option value="HT1">HT1</option><option value="LT1">LT1</option>
      <option value="HT2">HT2</option><option value="LT2">LT2</option>
      <option value="HT3">HT3</option><option value="LT3">LT3</option>
      <option value="HT4">HT4</option><option value="LT4">LT4</option>
      <option value="HT5">HT5</option><option value="LT5">LT5</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>Player</th><th>Tier</th><th style="text-align:right;">Rating</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none;">
      <div>No players match that search.</div>
    </div>
  </div>
</main>

<footer>Data refreshes automatically from leaderboard.json</footer>

<script>
  let players = [];

  function tierClass(tier) {
    return tier ? tier.toLowerCase() : 'lt5';
  }

  function badgeStyle(tier) {
    const t = tierClass(tier);
    return `background: var(--${t}-bg); color: var(--${t}); border-color: var(--${t}-border);`;
  }

  function avatarUrl(name, size) {
    return 'https://mc-heads.net/avatar/' + encodeURIComponent(name) + '/' + size;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function animateNumber(el, target) {
    const duration = 600;
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(target * eased);
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function renderPodium() {
    const slot = document.getElementById('podium-slot');
    if (players.length === 0) { slot.innerHTML = ''; return; }

    const top3 = players.slice(0, 3);
    slot.innerHTML = '<div class="podium">' + top3.map((p, i) => `
      <div class="podium-card rank-${i + 1}">
        <div class="podium-rank">#${i + 1}</div>
        <img class="podium-avatar" src="${avatarUrl(p.name, i === 0 ? 68 : 52)}" alt=""
             onerror="this.style.visibility='hidden'">
        <div class="podium-name">${escapeHtml(p.name)}</div>
        <span class="badge" style="${badgeStyle(p.tier)}"><span class="dot"></span>${p.tier}</span>
        <div class="podium-rating display" data-target="${p.rating}">0</div>
      </div>
    `).join('') + '</div>';

    slot.querySelectorAll('.podium-rating').forEach(el => {
      animateNumber(el, parseInt(el.dataset.target, 10));
    });
  }

  function render() {
    const search = document.getElementById('search').value.trim().toLowerCase();
    const tierFilter = document.getElementById('tier-filter').value;

    const filtered = players.filter(p => {
      const matchesSearch = !search || p.name.toLowerCase().includes(search);
      const matchesTier = !tierFilter || p.tier === tierFilter;
      return matchesSearch && matchesTier;
    });

    const rowsEl = document.getElementById('rows');
    const emptyEl = document.getElementById('empty');

    if (filtered.length === 0) {
      rowsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    rowsEl.innerHTML = filtered.map((p) => {
      const rank = players.indexOf(p) + 1;
      return `
      <tr>
        <td class="rank">${rank}</td>
        <td class="player">
          <img class="avatar" src="${avatarUrl(p.name, 26)}" alt="" loading="lazy"
               onerror="this.style.visibility='hidden'">
          ${escapeHtml(p.name)}
        </td>
        <td><span class="badge" style="${badgeStyle(p.tier)}"><span class="dot"></span>${p.tier}</span></td>
        <td class="rating">${p.rating}</td>
      </tr>
    `;
    }).join('');
  }

  async function loadData() {
    try {
      const res = await fetch('leaderboard.json?_=' + Date.now());
      if (!res.ok) throw new Error('Could not load leaderboard.json');
      const data = await res.json();

      players = (data.players || []).slice().sort((a, b) => b.rating - a.rating);
      document.getElementById('updated-at').textContent =
        'Updated ' + new Date(data.generatedAt || Date.now()).toLocaleString();

      renderPodium();
      render();
    } catch (err) {
      document.getElementById('updated-at').textContent = '';
      document.querySelector('main').innerHTML =
        '<div class="error">Could not load leaderboard.json.<br>Make sure it is sitting next to this index.html file.</div>';
    }
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('tier-filter').addEventListener('change', render);

  loadData();
  setInterval(loadData, 60000);
</script>

</body>
</html>
